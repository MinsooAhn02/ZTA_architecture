# ============================================================
#  OPA Policy ConfigMap
#  ZTA Policy Decision Point (PDP)
#
#  Defense layers this policy implements:
#    - North-South: role header check (Scenario A/B)
#    - Context-based: role + HTTP method + path (Scenario C)
#    - JWT Claim-based: decode Bearer token, check realm roles (Scenario D)
#    - East-West: source.principal (ServiceAccount) check
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy
data:
  policy.rego: |
    package istio.authz

    import input.attributes.request.http as http_request
    import input.attributes.source as source_info

    default allow = false

    # ──────────────────────────────────────────────────────────
    # [East-West Internal Traffic Defense]
    # Scenario A: Lateral Movement 방어
    #
    # frontend-sa ServiceAccount → backend: GET만 허용
    # 원리: Istio가 mTLS SPIFFE ID(source.principal)를 검증
    #       OPA는 이 검증된 신원에 기반해 인가 결정
    #
    # 왜 이것만으로는 부족한가?
    #   → 이 규칙은 OPA ext-authz 경로를 통해야만 적용됨
    #   → PeerAuthentication(STRICT mTLS) + AuthorizationPolicy(backend)가
    #     1차/2차 방어선으로 이미 존재 (defense-in-depth)
    # ──────────────────────────────────────────────────────────
    allow {
        source_info.principal == "cluster.local/ns/default/sa/frontend-sa"
        http_request.method == "GET"
        not startswith(http_request.path, "/api/admin")
    }

    # ══════════════════════════════════════════════════════════
    # [DEMO SCAFFOLDING — Scenario A/C only]
    # 헤더 기반 role 체크: 클라이언트가 직접 조작 가능한 신뢰할 수 없는 값
    # Scenario C는 이 취약점을 의도적으로 시연 → Scenario D(JWT)가 이를 대체
    #
    # Production에서는 이 블록 전체 제거, JWT 경로(아래)만 사용할 것
    # ══════════════════════════════════════════════════════════

    # Scenario A 테스트: role:admin 헤더 → 기본 통과 시연
    allow {
        http_request.headers.role == "admin"
        device_posture_ok(http_request)
    }

    # Scenario C: role:user → GET만 허용, /api/admin 차단
    # 목적: "인증된 사용자도 컨텍스트에 따라 제한됨" 시연
    # 한계: 헤더 값은 클라이언트가 임의 설정 가능 → Scenario D로 보완
    allow {
        http_request.headers.role == "user"
        http_request.method == "GET"
        not startswith(http_request.path, "/api/admin")
    }

    # ══════════════════════════════════════════════════════════
    # [PRODUCTION PATH — Scenario D/E]
    # JWT 클레임 기반: Istio가 서명 검증 후 OPA가 인가 결정
    # ══════════════════════════════════════════════════════════

    # ──────────────────────────────────────────────────────────
    # [Scenario D: JWT Role Claim-Based Access Control]
    # Istio가 JWT 서명 검증 → OPA가 클레임으로 인가 결정
    #
    # 왜 OPA에서 JWT를 디코딩하는가?
    #   - Istio RequestAuthentication: 서명(authenticity) 검증
    #   - OPA: 클레임 내용(authorization) 기반 세밀한 인가
    #   - 역할 분리: "이 토큰이 진짜인가(인증)" vs "무엇을 할 수 있는가(인가)"
    #   - io.jwt.decode()는 서명 재검증 없이 payload만 파싱
    #     (이미 Istio가 검증했으므로 중복 불필요)
    #
    # JWT admin role → 모든 경로/메서드 허용
    # (Scenario E) Device posture 헤더가 명시적으로 불량이면 차단
    # ──────────────────────────────────────────────────────────
    allow {
        jwt_has_role(http_request, "admin")
        device_posture_ok(http_request)
    }

    # JWT viewer role → GET만 허용, /api/admin 접근 불가
    # 동일한 JWT 구조로 context-based 제어 시연
    allow {
        jwt_has_role(http_request, "viewer")
        not jwt_has_role(http_request, "admin")
        http_request.method == "GET"
        not startswith(http_request.path, "/api/admin")
    }

    # ──────────────────────────────────────────────────────────
    # [Scenario E: Device Posture Simulation]
    # x-device-firewall:
    #   - missing or enabled  -> 허용
    #   - disabled            -> 차단
    #
    # 의도: 기존 시나리오(C/D)를 깨지 않으면서,
    # "유효한 admin 자격증명 + 불량 posture"를 차단 시연
    # ──────────────────────────────────────────────────────────
    device_posture_ok(req) {
        not req.headers["x-device-firewall"]
    }

    device_posture_ok(req) {
        lower(req.headers["x-device-firewall"]) == "enabled"
    }

    # ──────────────────────────────────────────────────────────
    # Helper: Bearer JWT에서 Keycloak realm_access.roles 확인
    # io.jwt.decode([token]) → [header, payload, signature]
    # payload.realm_access.roles = ["admin", "default-roles-myrealm", ...]
    # ──────────────────────────────────────────────────────────
    jwt_has_role(req, role) {
        bearer := req.headers.authorization
        startswith(bearer, "Bearer ")
        token := trim_prefix(bearer, "Bearer ")
        [_, payload, _] := io.jwt.decode(token)
        role == payload.realm_access.roles[_]
    }
---
# ============================================================
#  OPA Deployment
#
#  sidecar.istio.io/inject: "false" — 의도적 설계 결정
#  이유: OPA에 Envoy 사이드카를 주입하면 순환 의존성 발생
#    Envoy → OPA 호출(ext-authz) → OPA의 사이드카가 다시 OPA에 인가 요청
#    → 무한 루프. OPA는 메시의 PDP로서 메시 외부에 위치해야 함.
#
#  Sandbox 한계: Envoy ↔ OPA 구간(gRPC :9191)이 평문.
#  Production 대응: NetworkPolicy로 포트 9191을 mesh-internal 트래픽만
#    허용하도록 제한 (k8s/opa-network-policy.yaml 참고).
#
#  - decision_logs.console=true → OPA 결정 로그 전체 추적 가능
#  - envoy_ext_authz_grpc: Envoy와 gRPC로 통신
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    app: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:0.70.0-envoy
          ports:
            - containerPort: 8181
            - containerPort: 9191
          args:
            - "run"
            - "--server"
            - "--addr=:8181"
            - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
            - "--set=plugins.envoy_ext_authz_grpc.path=istio/authz/allow"
            - "--set=decision_logs.console=true"
            - "/policies/policy.rego"
          volumeMounts:
            - readOnly: true
              mountPath: /policies
              name: opa-policy-vol
      volumes:
        - name: opa-policy-vol
          configMap:
            name: opa-policy
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  labels:
    app: opa
spec:
  ports:
    - name: grpc
      port: 9191
      targetPort: 9191
    - name: http
      port: 8181
      targetPort: 8181
  selector:
    app: opa
