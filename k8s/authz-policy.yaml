apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ext-authz-policy
  namespace: default
spec:
  # 이 정책을 적용할 대상 (Frontend 앱)
  selector:
    matchLabels:
      app: frontend

  # 검사 방식: 외부(CUSTOM) 제공자 사용
  action: CUSTOM
  provider:
    name: "opa-provider" # Istio mesh config에 등록된 ext-authz gRPC provider

  # 모든 경로(/*)에 대해 검사 수행
  rules:
    - to:
        - operation:
            paths: ["/*"]
